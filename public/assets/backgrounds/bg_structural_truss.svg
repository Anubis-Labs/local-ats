<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" fill="none">
  <defs>
    <linearGradient id="trussGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121620" stop-opacity="0.96"/>
      <stop offset="50%" stop-color="#0B0E15" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#06070B" stop-opacity="1"/>
    </linearGradient>
    <pattern id="trussPattern" width="120" height="120" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="120" y2="120" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
      <line x1="120" y1="0" x2="0" y2="120" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
      <rect x="0" y="0" width="120" height="120" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <circle cx="60" cy="60" r="2" fill="rgba(212,197,169,0.3)"/>
      <circle cx="0" cy="0" r="2" fill="rgba(255,255,255,0.2)"/>
      <circle cx="120" cy="0" r="2" fill="rgba(255,255,255,0.2)"/>
      <circle cx="0" cy="120" r="2" fill="rgba(255,255,255,0.2)"/>
      <circle cx="120" cy="120" r="2" fill="rgba(255,255,255,0.2)"/>
    </pattern>
  </defs>
  <rect width="1440" height="900" fill="url(#trussGrad)"/>
  <rect width="1440" height="900" fill="url(#trussPattern)"/>
  <!-- Structural diagonal chords -->
  <g stroke="rgba(212,197,169,0.12)" stroke-width="2" fill="none">
    <path d="M 0 300 L 400 300 L 600 500 L 1000 500 L 1440 300"/>
    <path d="M 0 350 L 420 350 L 620 550 L 1020 550 L 1440 350"/>
    <line x1="200" y1="300" x2="200" y2="350"/>
    <line x1="400" y1="300" x2="400" y2="350"/>
    <line x1="800" y1="500" x2="800" y2="550"/>
    <line x1="1200" y1="300" x2="1200" y2="350"/>
  </g>
</svg>
