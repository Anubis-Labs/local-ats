  </g>
  <g stroke="rgba(212,197,169,0.2)" stroke-width="1" stroke-dasharray="4 4">
    <line x1="300" y1="200" x2="600" y2="450"/>
    <line x1="600" y1="200" x2="900" y2="450"/>
    <line x1="900" y1="450" x2="1200" y2="700"/>
