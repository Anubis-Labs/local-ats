<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" fill="none">
  <defs>
    <linearGradient id="subGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1624" stop-opacity="0.96"/>
      <stop offset="50%" stop-color="#09101C" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#05080E" stop-opacity="1"/>
