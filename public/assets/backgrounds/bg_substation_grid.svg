  </g>
  <g fill="rgba(86,163,150,0.4)">
    <circle cx="300" cy="200" r="4"/>
    <circle cx="600" cy="200" r="4"/>
    <circle cx="900" cy="200" r="4"/>
    <circle cx="1200" cy="200" r="4"/>
    <circle cx="300" cy="450" r="4"/>
    <circle cx="600" cy="450" r="4"/>
    <circle cx="900" cy="450" r="4"/>
    <circle cx="1200" cy="450" r="4"/>
