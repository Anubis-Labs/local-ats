  </defs>
  <rect width="1440" height="900" fill="url(#subGrad)"/>
  <!-- Busbars and circuit nodes -->
  <g stroke="rgba(86,163,150,0.18)" stroke-width="1.5" fill="none">
    <line x1="100" y1="200" x2="1340" y2="200"/>
    <line x1="100" y1="450" x2="1340" y2="450"/>
    <line x1="100" y1="700" x2="1340" y2="700"/>
    <line x1="300" y1="100" x2="300" y2="800"/>
    <line x1="600" y1="100" x2="600" y2="800"/>
